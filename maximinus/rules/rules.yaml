# Each rule fires only when every fact in `when` is present.
# `actions` are proposed apt packages or setup steps. Nothing here gets
# executed by the rule itself; it's only reported in the plan.

- id: nvidia-driver
  when: [gpu.nvidia]
  actions:
    - type: apt_install
      packages: [nvidia-driver-535]
  reason: "NVIDIA GPU detected"

- id: amd-driver
  when: [gpu.amd]
  actions:
    - type: apt_install
      packages: [firmware-amd-graphics, mesa-vulkan-drivers]
  reason: "AMD GPU detected"

- id: intel-microcode
  when: [cpu.microcode_intel]
  actions:
    - type: apt_install
      packages: [intel-microcode]
  reason: "Intel CPU detected"

- id: amd-microcode
  when: [cpu.microcode_amd]
  actions:
    - type: apt_install
      packages: [amd64-microcode]
  reason: "AMD CPU detected"

- id: broadcom-wifi
  when: [wifi.broadcom]
  actions:
    - type: apt_install
      packages: [bcmwl-kernel-source]
  reason: "Broadcom wireless chipset detected"

- id: ntfs-support
  when: [fs.ntfs_present]
  actions:
    - type: apt_install
      packages: [ntfs-3g]
  reason: "NTFS-formatted drive/partition detected"

- id: exfat-support
  when: [fs.exfat_present]
  actions:
    - type: apt_install
      packages: [exfatprogs]
  reason: "exFAT-formatted drive/partition detected"

- id: luks-auto-unlock
  when: [fs.luks_present]
  actions:
    - type: manual_step
      description: "Run `maximinus enroll-drive <device>` to unlock this drive automatically at boot (asks for your existing passphrase once)."
  reason: "Encrypted (LUKS) drive detected that is not yet set up for automatic unlock"

- id: nvidia-conflicting-packages
  when: [gpu.nvidia_conflicting_packages]
  actions:
    - type: manual_step
      description: >-
        More than one NVIDIA driver package is installed at once. You can
        check with `dpkg -l | grep nvidia-driver`. When this happens, apt
        and the kernel can't settle on one driver, so often neither one
        actually works. Run `ubuntu-drivers devices` to see which version
        is recommended, `sudo apt purge` every other nvidia-driver-*
        package, then `sudo apt install <recommended>` and reboot.
  reason: "Multiple NVIDIA driver packages installed simultaneously"

- id: nvidia-nouveau-conflict
  when: [gpu.nvidia_nouveau_conflict]
  actions:
    - type: manual_step
      description: >-
        The nvidia driver is installed, but the open-source nouveau driver
        is the one actually running the GPU right now. Only one driver can
        drive a given GPU at a time. To switch to nvidia, blacklist
        nouveau (add `blacklist nouveau` to
        /etc/modprobe.d/blacklist-nvidia-nouveau.conf), run
        `sudo update-initramfs -u`, and reboot.
  reason: "nouveau is active instead of the installed NVIDIA driver"

- id: nvidia-module-not-loaded
  when: [gpu.nvidia_module_not_loaded]
  actions:
    - type: manual_step
      description: >-
        A NVIDIA driver package is installed but its kernel module isn't
        loaded. Check `sudo dkms status` for a failed build, and `dmesg |
        grep -i nvidia` for the reason the module refused to load.
  reason: "NVIDIA driver installed but not active"

- id: nvidia-secureboot-blocking
  when: [gpu.secureboot_may_block_nvidia]
  actions:
    - type: manual_step
      description: >-
        Secure Boot is turned on and the nvidia module isn't loaded. This
        is a common combination: Secure Boot quietly refuses to load a
        proprietary module that isn't signed, without showing an error.
        Either enroll the MOK key that was generated when the driver was
        installed (`sudo mokutil --import
        /var/lib/shim-signed/mok/MOK.der`, then reboot and follow the blue
        enrollment screen), or turn off Secure Boot in your firmware
        settings.
  reason: "Secure Boot may be silently blocking the NVIDIA module"

- id: nvidia-smi-failing
  when: [gpu.nvidia_smi_failing]
  actions:
    - type: manual_step
      description: >-
        The nvidia kernel module is loaded, but `nvidia-smi` can't talk to
        it. This is usually a version mismatch between the kernel module
        and the installed userspace libraries, often left over from a
        previous driver version or a different install method. The
        cleanest fix is to reinstall the driver: `sudo apt purge
        '*nvidia*'` then `sudo apt install <recommended-version>` and
        reboot.
  reason: "nvidia-smi cannot communicate with the loaded driver"

- id: amd-module-not-loaded
  when: [gpu.amd_module_not_loaded]
  actions:
    - type: manual_step
      description: >-
        An AMD GPU is present but neither amdgpu nor radeon is loaded.
        Check `dmesg | grep -i amdgpu` for firmware-loading errors, and
        confirm the firmware-amd-graphics package is installed.
  reason: "AMD GPU detected but no kernel driver is active"

- id: amd-radeon-amdgpu-conflict
  when: [gpu.amd_radeon_amdgpu_conflict]
  actions:
    - type: manual_step
      description: >-
        Both the legacy radeon driver and modern amdgpu are loaded for the
        same class of hardware. Force one via a kernel parameter (e.g.
        `radeon.si_support=0 amdgpu.si_support=1` for Southern Islands
        cards, adjusted for your GPU generation) so only one claims the
        device.
  reason: "radeon and amdgpu are both loaded, which can conflict"

- id: cpu-microcode-wrong-vendor
  when: [cpu.microcode_wrong_vendor_installed]
  actions:
    - type: manual_step
      description: >-
        A CPU microcode package for the *other* vendor is installed (e.g.
        intel-microcode on an AMD CPU). It won't apply, but it's dead
        weight worth removing: `sudo apt purge intel-microcode` or `sudo
        apt purge amd64-microcode`, whichever doesn't match your CPU.
  reason: "Microcode package installed for a CPU vendor that isn't this machine's"

- id: apt-broken-state
  when: [apt.broken_state]
  actions:
    - type: manual_step
      description: "Run `maximinus fix apt-broken-state` to finish an interrupted dpkg/apt run (dpkg --configure -a; apt-get install -f)."
  reason: "dpkg reports packages left half-configured (an interrupted install/upgrade)"

- id: dkms-headers-missing
  when: [dkms.headers_missing]
  actions:
    - type: manual_step
      description: "Run `maximinus fix dkms-headers-missing` to install linux-headers-$(uname -r) so DKMS modules (NVIDIA, VirtualBox, ...) can actually build."
  reason: "DKMS modules are registered but the matching kernel headers aren't installed"

- id: time-sync-disabled
  when: [time.ntp_disabled]
  actions:
    - type: manual_step
      description: "Run `maximinus fix time-sync-disabled` to enable NTP time sync (a drifted clock causes confusing apt/TLS failures)."
  reason: "NTP time synchronization is disabled"

- id: grub-os-prober-disabled
  when: [grub.os_prober_disabled_with_other_os]
  actions:
    - type: manual_step
      description: "Run `maximinus fix grub-os-prober-disabled` to make GRUB list the other OS it found (installs os-prober, enables it, regenerates the GRUB menu)."
  reason: "A likely dual-boot OS was found but GRUB isn't set up to show it"

- id: audio-pulseaudio-pipewire-conflict
  when: [audio.pulseaudio_pipewire_conflict]
  actions:
    - type: manual_step
      description: >-
        Both PulseAudio and PipeWire's PulseAudio replacement are
        installed, and they can end up fighting over the audio device.
        Mint uses PipeWire by default, so the fix is to remove the old
        one: `sudo apt purge pulseaudio`. This isn't done automatically
        because removing it while audio is actively playing can interrupt
        whatever's using it right now.
  reason: "Both pulseaudio and pipewire-pulse are installed"

- id: firewall-ufw-inactive
  when: [firewall.ufw_inactive]
  actions:
    - type: manual_step
      description: >-
        ufw is installed but not turned on. You can enable it with `sudo
        ufw enable`. This isn't done automatically because if you connect
        to this machine remotely (SSH, for example), turning on the
        firewall without first allowing that port could lock you out.
        Allow it first with `sudo ufw allow ssh` if that applies to you.
  reason: "Firewall (ufw) is installed but inactive"

- id: storage-pool-candidate
  when: [storage.poolable]
  actions:
    - type: manual_step
      description: "Run `maximinus pool-drives` to merge matching folders (e.g. Downloads) across your drives into one combined view with shared free space. No files are moved."
  reason: "Multiple drives/partitions with matching folder structure detected"

- id: laptop-power-management
  when: [power.tlp_missing]
  actions:
    - type: apt_install
      packages: [tlp]
  reason: "This looks like a laptop, and no power-management tool is installed"

- id: firmware-updates
  when: [firmware.fwupd_missing]
  actions:
    - type: apt_install
      packages: [fwupd]
  reason: "No tool installed for checking or applying firmware updates"

- id: media-codecs
  when: [media.codecs_missing]
  actions:
    - type: apt_install
      packages: [libavcodec-extra]
  reason: "Common media codecs aren't installed, so some audio/video files may not play"

- id: printing-support
  when: [printing.cups_missing]
  actions:
    - type: apt_install
      packages: [cups]
  reason: "No printing system installed, so printers won't be usable yet"

- id: low-memory-no-swap
  when: [mem.low_ram_no_swap]
  actions:
    - type: manual_step
      description: "Run `maximinus fix low-memory-no-swap` to create a 2 GiB swap file. This machine has under 4 GiB of RAM and no swap configured, which usually means slowdowns or crashes once memory runs out."
  reason: "Low RAM and no swap of any kind configured"

- id: hfsplus-support
  when: [fs.hfsplus_present]
  actions:
    - type: apt_install
      packages: [hfsplus, hfsprogs]
  reason: "HFS+ (macOS) formatted drive/partition detected"
